[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "instapull"
version = "0.1.0"
description = "Turn Instagram saved posts into an AI-agent-readable JSON memory layer"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "InstaPull contributors" },
]
keywords = ["instagram", "saved-posts", "ai-agents", "vision", "json", "memory"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Topic :: Utilities",
]

# Core dependencies always installed
dependencies = [
    "instaloader>=4.10",
    "browser-cookie3>=0.19",
    "requests>=2.31",
    "click>=8.1",
    "python-dotenv>=1.0",
    "Pillow>=10.0",
    "opencv-python-headless>=4.9",
]

[project.optional-dependencies]
gemini  = ["google-genai>=0.8"]
ollama  = []
all     = ["google-genai>=0.8"]

[project.scripts]
instapull = "instapull.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["instapull*"]
